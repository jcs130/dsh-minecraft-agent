# 组合包配置层（dsh.bundle.patch，官方安装形态的激活开关）。
#
# `dsh plugin --profile <name> add <tarball|npm|github>` 安装本包后，本层把
# 穿越者侧 13 个插件注入 dsh 主进程：dsh --profile <name> "<任务>" 启动即得
# 一个 Minecraft 穿越者 agent（工具/记忆/咏唱/村庄/进化全量挂载）。
# 世界侧插件（mc-god/mc-rcon/magic/ritual/social/logwatch/worlddb）属服务器
# 端项目，不在本包——见 README 双仓边界说明。
#
# 用户可在自己 profile 的 cordis.patch.yml 里按 id 覆盖任意行（后层胜出，
# 但需重述整行 config）。
- insert:
    # 本地 Qwen3.8 vLLM 的薄 OpenAI 适配器：把 `qwen-local` provider 注册进
    # dsh 的 LLM runtime（:8890，含 VL image 块 + Qwen3.8 推理档位）。必须先于
    # 任何会发起 LLM 调用的插件加载。
    - id: llm-qwen-local
      name: 'dsh-minecraft-agent/lib/plugins/llm-qwen-local.mjs'
      config:
        baseURL: 'http://127.0.0.1:8890/v1'
        apiKey: 'sk-local'
        models:
          - id: 'qwen3.8-27b'
            contextWindow: 262144
            maxTokens: 8192

    - id: mc-bot
      name: 'dsh-minecraft-agent/lib/plugins/mc-bot.mjs'
      config:
        host: 'localhost'
        port: 25565
        username: 'HarnessBot'
        autoReconnect: true
        viewerEnabled: false

    - id: mc-tools
      name: 'dsh-minecraft-agent/lib/plugins/mc-tools.mjs'
      # episodic 记忆与截图的运行时目录；须与 mc-session/mc-panel 的 dataDir 同源
      # （默认 ./data 按 dsh 进程 cwd 解析，标准形态下即 profile data）。
      config:
        dataDir: './data'

    - id: mc-memory
      name: 'dsh-minecraft-agent/lib/plugins/mc-memory.mjs'
      config:
        memoryPath: './data/mc-memory.json'
        maxPointsPerType: 20

    - id: mc-transmigrator
      name: 'dsh-minecraft-agent/lib/plugins/mc-transmigrator.mjs'
      config:
        registryPath: './data/transmigrators.json'

    - id: mc-identity
      name: 'dsh-minecraft-agent/lib/plugins/mc-identity.mjs'

    - id: mc-mystic
      name: 'dsh-minecraft-agent/lib/plugins/mc-mystic.mjs'

    - id: mc-wiki
      name: 'dsh-minecraft-agent/lib/plugins/mc-wiki.mjs'

    - id: mc-village
      name: 'dsh-minecraft-agent/lib/plugins/mc-village.mjs'

    - id: mc-memos
      name: 'dsh-minecraft-agent/lib/plugins/mc-memos.mjs'
      config:
        enabled: true
        baseUrl: 'http://127.0.0.1:8002'
        timeoutMs: 8000
        maxRecall: 5

    - id: mc-evolve
      name: 'dsh-minecraft-agent/lib/plugins/mc-evolve.mjs'
      config:
        enabled: true
        cooldownHours: 12

    - id: mc-adapt
      name: 'dsh-minecraft-agent/lib/plugins/mc-adapt.mjs'

    # 穿越者 = 独立 dsh session agent（新形态）：创建 agent + persona 阴影 +
    # Timer steer。替代旧 mc-loop 自驱；mc-loop 在 profile 形态下关闭。
    - id: mc-session
      name: 'dsh-minecraft-agent/lib/plugins/mc-session.mjs'
      config:
        enabled: true
        username: 'HarnessBot'
        provider: 'qwen-local'
        model: 'qwen3.8-27b'
        intervalMs: 8000
        goal: 'Explore the area, gather wood and coal, and stay alive. Eat food when hungry.'

    - id: mc-loop
      name: 'dsh-minecraft-agent/lib/plugins/mc-loop.mjs'
      config:
        enabled: false

    - id: mc-panel
      name: 'dsh-minecraft-agent/lib/plugins/mc-panel.mjs'
